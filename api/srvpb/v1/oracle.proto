// The claim settlement process, one flow run per claim.  The claim id is the
// run id.
service CdcsService {
  // Start a claim.
  rpc StartClaim(pb.v1.StartClaimRequest) returns (pb.v1.StartClaimResponse) {
    option (google.api.http) = {
      post: "/v1/cdcs/claims"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Claims"};
  }

  // Read a claim: its state, the step it waits at, and its result.
  rpc GetClaim(pb.v1.GetClaimRequest) returns (pb.v1.GetClaimResponse) {
    option (google.api.http) = {get: "/v1/cdcs/claims/{claim_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Claims"};
  }

  // The eSignature webhook: the settlement contract is signed.
  rpc ContractSigned(pb.v1.ContractSignedRequest) returns (pb.v1.ContractSignedResponse) {
    option (google.api.http) = {
      post: "/v1/cdcs/claims/{claim_id}/contract-signed"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Webhooks"};
  }

  // The payment team approved the payment.
  rpc PaymentApproved(pb.v1.PaymentApprovedRequest) returns (pb.v1.PaymentApprovedResponse) {
    option (google.api.http) = {
      post: "/v1/cdcs/claims/{claim_id}/payment-approved"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Webhooks"};
  }

  // The ABS webhook: the payment status.
  rpc PaymentStatus(pb.v1.PaymentStatusRequest) returns (pb.v1.PaymentStatusResponse) {
    option (google.api.http) = {
      post: "/v1/cdcs/claims/{claim_id}/payment-status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {tags: "Webhooks"};
  }
}
