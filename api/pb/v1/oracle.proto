// ------------------------------------------------------------
// CLAIM FLOW (phylum/claim.lisp)
// ------------------------------------------------------------

// Request to start a claim.  The phylum fails the start, and writes
// nothing, when a required field is missing.
message StartClaimRequest {
  string policy_id = 1; // Required
  string guidewire_claim_id = 2; // Required
  string invoice_amount = 3; // Required
  string signer_name = 4; // Required: signs the settlement invoice
  string signer_email = 5; // Required
  string originator_name = 6; // Optional: a demo default if empty
  string recipient_name = 7; // Optional: a demo default if empty
  string issue_date = 8; // Optional (YYYY-MM-DD): a demo default if empty
  // Optional: send the same key again to get the same claim back instead of
  // a second claim.  The portal makes a new key when it is empty.
  string request_key = 9;
}

// Request to read a claim.
message GetClaimRequest {
  string claim_id = 1; // Required
}

// The signed contract arrived (eSignature webhook).
message ContractSignedRequest {
  string claim_id = 1; // Required
  string signed_by = 2; // Required: email of the signer
  // Optional: the input's request key in the claim flow.  A resend after the
  // claim moved on is refused either way, so it never applies twice.
  string request_key = 3;
}

// The payment team approved the payment.
message PaymentApprovedRequest {
  string claim_id = 1; // Required
  string signed_by = 2; // Required: email of the approver
  // Optional: the input's request key in the claim flow.  A resend after the
  // claim moved on is refused either way, so it never applies twice.
  string request_key = 3;
}

// ABS reports the payment status: approved, rejected or pending.  The claim
// waits for another status after pending.
message PaymentStatusRequest {
  string claim_id = 1; // Required
  string payment_id = 2; // Required
  string status = 3; // Required: approved, rejected or pending
  // Optional: the input's request key in the claim flow.  A resend after the
  // claim moved on is refused either way, so it never applies twice.
  string request_key = 4;
}

// A claim as its flow run reports it.
message Claim {
  string claim_id = 1;
  // waiting, done or failed.
  string state = 2;
  // The step the claim waits at, for example "contract-signed".
  string step = 3;
  // The claim's request with the defaults filled in.
  google.protobuf.Struct details = 4;
  // The summary when state is done, with "decision" paid or payment rejected.
  google.protobuf.Struct result = 5;
  // Why the claim failed, when state is failed.
  google.protobuf.Value error = 6;
}

// The responses of the claim RPCs: the claim, or why the call was refused.
message StartClaimResponse {
  oneof result {
    common.v1.Exception exception = 1;
    Claim claim = 2;
  }
}

message GetClaimResponse {
  oneof result {
    common.v1.Exception exception = 1;
    Claim claim = 2;
  }
}

message ContractSignedResponse {
  oneof result {
    common.v1.Exception exception = 1;
    Claim claim = 2;
  }
}

message PaymentApprovedResponse {
  oneof result {
    common.v1.Exception exception = 1;
    Claim claim = 2;
  }
}

message PaymentStatusResponse {
  oneof result {
    common.v1.Exception exception = 1;
    Claim claim = 2;
  }
}
