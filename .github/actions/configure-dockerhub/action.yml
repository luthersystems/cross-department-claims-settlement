name: configure-dockerhub
description: >-
  Log in to Docker Hub for a release push, with Docker Hub OIDC only. It uses
  no stored credential. The calling job needs `permissions: id-token: write`.
  It tries up to three times, then fails the job, because a push cannot fall
  back to anonymous access. The same pattern as luthersystems/substrate.

  Token lifetime: docker/login-action exchanges the GitHub OIDC token for a
  Docker Hub access token that expires after DOCKERHUB_OIDC_EXPIREIN seconds
  (default 300, range 300-3600). There is no refresh: once it expires every
  registry call, including pulls of public images, fails with 401. This
  action asks for the maximum, 3600, so log in right before the docker work,
  keep each docker step under 60 minutes, and log in again before a later
  docker step.
inputs:
  connection-id:
    description: >-
      Docker Home OIDC connection ID (not a secret). The connection needs a
      ruleset that matches this repository's tag subject with read and write
      on the pushed Docker Hub repositories.
    default: c5a3b4b1-e0dc-4f63-88f4-d71cc0442085
  oidc-expires-in:
    description: >-
      Lifetime in seconds (300-3600) of the OIDC-issued Docker Hub token.
    required: false
    default: "3600"
  username:
    description: Docker organization OIDC authenticates as (not a user).
    default: luthersystems
runs:
  using: composite
  steps:
    - name: Install Docker (ARM runners)
      if: runner.arch == 'ARM64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl gnupg make
        sudo install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
        sudo chmod a+r /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
        sudo chmod 666 /var/run/docker.sock
    - name: Check OIDC availability
      shell: bash
      env:
        CONNECTION_ID: ${{ inputs.connection-id }}
      run: |
        if [ -z "$CONNECTION_ID" ]; then
          echo "::error title=Docker Hub login::connection-id is empty"
          exit 1
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error title=Docker Hub login::no id-token; give the job 'permissions: id-token: write'"
          exit 1
        fi
    - name: Log in to Docker Hub (OIDC, attempt 1)
      id: oidc1
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    - name: Wait before OIDC retry
      if: steps.oidc1.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Log in to Docker Hub (OIDC, attempt 2)
      id: oidc2
      if: steps.oidc1.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    - name: Wait before OIDC retry
      if: steps.oidc2.outcome == 'failure'
      shell: bash
      run: sleep 15
    - name: Log in to Docker Hub (OIDC, attempt 3)
      if: steps.oidc2.outcome == 'failure'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
