name: Build, Push, and Release
on:
  push:
    tags:
      - "*"
jobs:
  build-push-docker:
    name: ${{ matrix.arch }} - docker build
    runs-on: ${{ fromJSON('{"arm64":"ubuntu-22.04-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    permissions:
      id-token: write # Docker Hub OIDC login
      contents: read # actions/checkout
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0 # include tags for VERSION detection
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The OIDC Docker Hub token lives at most 3600s with no refresh, so log
      # in right before the docker work and keep that step under 60 minutes.
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Publish Docker
        timeout-minutes: 60
        run: make publish VERSION="$GITHUB_REF_NAME" TAG_SUFFIX=-${{ matrix.arch }}
  push-docker-manifests:
    runs-on: ubuntu-22.04
    needs:
      - build-push-docker
    permissions:
      id-token: write # Docker Hub OIDC login
      contents: read # actions/checkout
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # A fresh login: the build job's token is not shared, and it lasts at
      # most 3600s.
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Publish
        timeout-minutes: 60
        run: make publish-docker-manifests VERSION="$GITHUB_REF_NAME"
