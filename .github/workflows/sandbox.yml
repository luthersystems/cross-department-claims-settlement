name: CI Tests
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # No golangci-lint step: the shared Quality workflow
      # (.github/workflows/quality.yml, from luthersystems/.github) runs the
      # pinned golangci-lint with .golangci.yml on every PR and on push to main.
      - name: Run CI tests
        env:
          CONNECTORHUB_VERSION: ${{ vars.CONNECTORHUB_VERSION || 'latest' }}
          SKIP_CONNECTORHUB_LOCAL_BUILD: 1
        run: script -q -e -c "make citest"

  # Start and stop the local Fabric network (fabric/Makefile fnb-smoke) with
  # the builder as the runner's user, not root, as `make up` does.
  fabric-network:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Start and stop the local Fabric network
        run: make -C fabric fnb-smoke
