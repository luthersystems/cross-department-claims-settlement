name: CI Tests
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # Docker Hub OIDC login
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Built with Go 1.26: an older golangci-lint refuses a go 1.26 module.
          version: v2.15.0
      # Pull-only: every image this job pulls is public, so a failed login
      # warns and pulls anonymously. The token lives at most 3600s.
      - name: Log in to Docker Hub (pull only)
        uses: ./.github/actions/ci-dockerhub-login
      - name: Run CI tests
        timeout-minutes: 60
        env:
          CONNECTORHUB_VERSION: ${{ vars.CONNECTORHUB_VERSION || 'latest' }}
          SKIP_CONNECTORHUB_LOCAL_BUILD: 1
        run: script -q -e -c "make citest"

  # Start and stop the local Fabric network (fabric/Makefile fnb-smoke) with
  # the builder as the runner's user, not root, as `make up` does.
  fabric-network:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      id-token: write # Docker Hub OIDC login
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@v5
      # Pull-only: every image this job pulls is public, so a failed login
      # warns and pulls anonymously. The token lives at most 3600s.
      - name: Log in to Docker Hub (pull only)
        uses: ./.github/actions/ci-dockerhub-login
      - name: Start and stop the local Fabric network
        run: make -C fabric fnb-smoke
